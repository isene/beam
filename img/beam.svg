<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- the projector: a small screen beaming onto the big one -->
  <rect x="34" y="118" width="52" height="36" rx="4"
        fill="#0a0a14" stroke="#7aa2c0" stroke-width="3"/>
  <rect x="42" y="126" width="24" height="5" rx="2" fill="url(#rust)"/>
  <rect x="42" y="136" width="30" height="5" rx="2" fill="#3d5a76"/>
  <rect x="42" y="146" width="18" height="5" rx="2" fill="#3d5a76"/>

  <!-- the beam -->
  <path d="M86 132 L150 92 L150 168 L86 144 Z" fill="url(#rust)" opacity="0.35"/>

  <!-- the external screen showing the chosen window -->
  <rect x="150" y="66" width="76" height="110" rx="6"
        fill="#0a0a14" stroke="#7aa2c0" stroke-width="3"/>
  <rect x="158" y="78" width="44" height="8" rx="3" fill="url(#rust)"/>
  <rect x="158" y="94" width="60" height="8" rx="3" fill="#3d5a76"/>
  <rect x="158" y="110" width="52" height="8" rx="3" fill="#3d5a76"/>
  <rect x="158" y="126" width="60" height="8" rx="3" fill="#3d5a76"/>

  <text x="128" y="212" font-family="monospace" font-size="24" font-weight="bold"
        fill="url(#rust)" text-anchor="middle" letter-spacing="3">beam</text>
  <text x="128" y="230" font-family="monospace" font-size="8" fill="#888"
        text-anchor="middle">what the room sees</text>
</svg>
